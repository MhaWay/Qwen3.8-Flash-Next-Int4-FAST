[project]
name = "flashnext-visual-systemone"
version = "0.1.0"
description = "Latest-frame visual decisions using an existing Qwen Flash Next vLLM server"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
visual-systemone = "visual_systemone.app:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
